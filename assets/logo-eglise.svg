<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Logo de l'Église</title>
  <desc id="desc">Un logo rond doré avec trône, feu et texte biblique.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3d789"/>
      <stop offset="18%" stop-color="#d6b14b"/>
      <stop offset="50%" stop-color="#fbf0c0"/>
      <stop offset="82%" stop-color="#d4a93c"/>
      <stop offset="100%" stop-color="#f0d98a"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>

  <g filter="url(#shadow)">
