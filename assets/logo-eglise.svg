    <text x="600" y="1018" font-size="64" letter-spacing="5">HÉBREUX 4:16</text>
    <text x="600" y="1105" font-size="54" letter-spacing="5">DÉCLENCHEMENT DES PROJETS INSTANTANÉS</text>
  </g>

