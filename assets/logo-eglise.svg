      <path d="M-170 -260 L-130 -190 L-20 -120 L20 -120 L130 -190 L170 -260" fill="none" stroke="#d5af52" stroke-width="10"/>
      <path d="M-170 -260 L-200 -310 Q-150 -330 -130 -290 L-105 -250" fill="#d9b767" stroke="#c99525" stroke-width="8"/>
